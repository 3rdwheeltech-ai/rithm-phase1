[project]
name = "rithm-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "structlog>=24.1",
    "aioboto3>=13.1",
    "aws-embedded-metrics>=3.2",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "uuid-utils>=0.9",          # UUIDv7 generation — Rust-backed, fast
    "tiktoken>=0.7",            # conversation token counting
    "httpx>=0.27",              # Cognito JWKS fetch + SNS confirm URL
    "python-multipart>=0.0.9",  # voice file upload
    "pyjwt[crypto]>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "anyio>=4.4",
    "ruff>=0.5",
    "pyright>=1.1",
    "import-linter>=2.1",
    "factory-boy>=3.3",
]

# ── Import boundary enforcement ─────────────────────────────────
# A module may ONLY depend on shared/ and its own interfaces.py.
# Direct cross-module imports fail CI.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Module independence"
type = "independence"
modules = [
    "app.modules.identity",
    "app.modules.catalog",
    "app.modules.generation",
    "app.modules.conversation",
    "app.modules.personalization",
]

# ── Test configuration ──────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Linting ─────────────────────────────────────────────────────
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
