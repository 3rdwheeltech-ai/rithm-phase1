# Alembic config for the 'conversation' module.
# One migration tree per bounded-context module; each keeps its own
# alembic_version table inside its own Postgres schema (version_table_schema).
# Invoked from api/ as: uv run alembic -c migrations/conversation/alembic.ini upgrade head
[alembic]
script_location = migrations/conversation
prepend_sys_path = .
version_table = alembic_version
version_table_schema = conversation

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
