name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: rithm/worker
  ECS_CLUSTER: rithm-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      # No HF_TOKEN, no --build-arg, no --cache-from gymnastics. ACE-Step is an
      # HTTP server and the worker is a client, so this image holds no model
      # weights: it is ~914 MB / 230 MB compressed and builds from
      # python:3.11-slim in about a minute. Everything the older runbook says
      # about a 12 GB image and cached weight layers is obsolete.
      #
      # --target production is byte-identical to --target stub; the target name
      # is kept so the intent of a build stays legible.
      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/amd64 \
            --provenance=false --sbom=false \
            --target production \
            -t "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            --push worker/

      # Describe-and-patch, not render-from-template: the task definition holds
      # ACESTEP_API_BASE and other values set by hand, and re-rendering would
      # silently overwrite them on the next unrelated push.
      #
      # The family is a repo variable rather than a hardcode because the
      # sidecar-vs-standalone decision for the ACE-Step server may change which
      # family is the real one.
      - name: Register a new task definition
        id: register
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TASK_FAMILY: ${{ vars.WORKER_TASK_FAMILY || 'rithm-worker' }}
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition' > td.json

          jq --arg IMG "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" '
              .containerDefinitions[0].image = $IMG
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' td.json > new-td.json

          REV=$(aws ecs register-task-definition --cli-input-json file://new-td.json \
                --query 'taskDefinition.revision' --output text)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "registered $TASK_FAMILY:$REV"

      # Registering is NOT deploying. This step used to be absent, on the theory
      # that the worker idles at desiredCount=0 and would pick the new revision
      # up on its next scale-up. That is true of rithm-worker-service (the GPU
      # service, still at 0) and false of rithm-worker-fg, which runs always-on
      # at 1 and therefore never scales up. The result was two weeks of silent
      # drift: user-supplied lyrics shipped, CI registered the image, and the
      # running task stayed on a revision that predated the feature and sent an
      # empty lyrics field to ACE-Step. Roll the service explicitly.
      - name: Roll the always-on worker
        env:
          TASK_FAMILY: ${{ vars.WORKER_TASK_FAMILY || 'rithm-worker' }}
          ECS_SERVICE: ${{ vars.WORKER_SERVICE || 'rithm-worker-fg' }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_FAMILY:${{ steps.register.outputs.revision }}" \
            --query 'service.deployments[0].{status:status,desired:desiredCount}' \
            --output table

          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "service stable on $TASK_FAMILY:${{ steps.register.outputs.revision }}"
