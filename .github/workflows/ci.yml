name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI reads the repo and nothing else. It needs no AWS credentials at all.
permissions:
  contents: read

jobs:
  # Path filtering happens HERE, inside the workflow — never as an `on.paths`
  # filter. A workflow skipped by `on.paths` never reports its checks, so a
  # branch-protection rule waiting on `ci / api` sits at "Expected — waiting for
  # status" forever and the PR can never merge.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'ops/db/**'
              - 'ops/scripts/**'
              - '.github/workflows/ci.yml'
            worker:
              - 'worker/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # A real Postgres is worth the setup cost. Day 3's keyset-pagination bug —
    # every page after the first returned a 500 — was caught only by the live-DB
    # suite; the unit test asserted the right thing about the SQL and the code
    # was still broken. Without a database here, that class of bug ships.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rithm-db
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Bootstrap the test database
        working-directory: .
        run: bash ops/scripts/ci-bootstrap-db.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: rithm-db

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports

      - name: pyright (ratchet)
        working-directory: .
        run: bash ops/scripts/pyright-ratchet.sh api

      - run: uv run pytest -q
        env:
          # The generation role is the code under test; the admin role does
          # setup and verification, because the cross-schema grant is narrow by
          # design and cannot read back what it wrote.
          RITHM_TEST_DB_DSN: postgresql+asyncpg://rithm_generation:dev_generation_pw@localhost:5432/rithm-db
          RITHM_TEST_DB_ADMIN_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/rithm-db

  worker:
    name: worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports

      # Strict and zero, and it has been zero since the worker was written.
      - name: pyright (ratchet)
        working-directory: .
        run: bash ops/scripts/pyright-ratchet.sh worker

      # The ffmpeg-gated audio tests skip here and pass inside the worker image,
      # where ffmpeg lives.
      - run: uv run pytest -q

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build is a gate, not a formality: a type-clean app that does not
      # build is not shippable.
      - run: npm run build
