[project]
name = "rithm-worker"
version = "0.1.0"
requires-python = ">=3.11"        # matches the API tree and both images
dependencies = [
    "structlog>=24.1",
    "boto3>=1.34",
    "sqlalchemy>=2.0",            # sync only — worker is not async
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uuid-utils>=0.9",
    # The ACE-Step client. The PoC settled that ACE-Step v1.5 is an HTTP server
    # with its own checkout and its own deps, NOT a Python import — so the
    # worker's entire model dependency is one HTTP library, and there is no
    # torch, no CUDA and no `gpu` dependency group in this tree any more.
    # ACE-Step's own requirements live in ACE-Step's repo, where they belong.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pyright>=1.1",
    "import-linter>=2.1",
]

# ── Import boundary enforcement ─────────────────────────────────
# The job pipeline is a layer cake: main drives processor, processor drives the
# capability modules, and those may only reach down. A capability module that
# imports processor or main is a cycle, and a cycle here means the stub/real
# inference seam can no longer be swapped without dragging the loop with it.
[tool.importlinter]
root_package = "worker"

[[tool.importlinter.contracts]]
name = "Worker layering"
type = "layers"
layers = [
    "worker.main",
    "worker.processor",
    "worker.inference | worker.storage | worker.messaging | worker.db | worker.audio",
    "worker.aws",
    "worker.config | worker.logging_setup",
]

# ── Test configuration ──────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires NVIDIA GPU (skip in CI)"]

# ── Linting ─────────────────────────────────────────────────────
# Mirrors api/pyproject.toml so both trees fail on the same things.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# boto3/botocore ship no py.typed, so every client and response is Any. The
# suppression is confined to the one module that touches the SDK — see its
# docstring.
"worker/aws.py" = ["ANN401"]
# Decoded JSON from the ACE-Step server is genuinely `Any` until it has been
# narrowed — _task_state exists precisely to do that narrowing in one place.
# processor.py takes the model handle through as an opaque pass-through.
"worker/inference.py" = ["ANN401"]
"worker/processor.py" = ["ANN401"]
# Test doubles stand in for boto3 clients and SQLAlchemy results; annotating
# them concretely would mean re-declaring library internals, not catching bugs.
"tests/*" = ["ANN401"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
